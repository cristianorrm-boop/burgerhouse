<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ensaio geral</title>
<link rel="stylesheet" href="/ferramentas/estilo.css">
</head>
<body>
<main>
  <h1>Ensaio geral em modo demo</h1>
  <div class="caixa">
    <p>Escolha o arquivo de backup. A cópia convertida é gravada só neste navegador (localStorage do demo). Nada vai ao banco real.</p>
    <input id="arquivo" type="file" accept="application/json,.json">
    <p id="estado" role="status"></p>
    <ul id="links" hidden></ul>
  </div>
</main>

<script type="module">
import { montarBancoDemo } from '/ferramentas/ensaio.mjs';

// Só localhost (sem carregar o SDK do Firebase).
if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
  document.body.innerHTML = '<main><p class="erro">Esta ferramenta só roda em localhost.</p></main>';
  throw new Error('Somente localhost');
}

const estado = document.getElementById('estado');
const links = document.getElementById('links');

function processar(texto) {
  try {
    const banco = montarBancoDemo(JSON.parse(texto));
    localStorage.setItem('co_db_v1', JSON.stringify(banco));
    sessionStorage.setItem('bh_demo', '1');
    const n = c => Object.keys(banco[c] || {}).length;
    const mesaId = Object.keys(banco.mesas || {})[0] || '';
    estado.textContent = `Pronto: ${n('produtos')} produtos, ${n('categorias')} categorias, ${n('mesas')} mesas, ${n('pedidos')} pedidos, ${n('vendas')} vendas.`;
    estado.dataset.pronto = '1';
    links.innerHTML = [
      ['/?demo=1', 'Cardápio (cliente)'],
      [`/index.html?mesa=${encodeURIComponent(mesaId)}&demo=1`, 'Cardápio de uma mesa real'],
      ['/admin/?demo=1', 'Admin (qualquer e-mail, senha com 6+ caracteres)'],
    ].map(([h, t]) => `<li><a href="${h}">${t}</a></li>`).join('');
    links.hidden = false;
  } catch (e) {
    estado.textContent = `Erro: ${e.message}`;
    estado.dataset.pronto = 'erro';
  }
}

document.getElementById('arquivo').addEventListener('change', async ev => {
  const f = ev.target.files[0];
  if (f) processar(await f.text());
});

// Automação local: /ferramentas/ensaio?arquivo=/backups/<nome>.json
const alvo = new URLSearchParams(location.search).get('arquivo');
if (alvo && /^\/backups\/[\w.-]+\.json$/.test(alvo)) {
  fetch(alvo).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
    .then(processar)
    .catch(e => { estado.textContent = `Erro: ${e.message}`; estado.dataset.pronto = 'erro'; });
}
</script>
</body>
</html>
